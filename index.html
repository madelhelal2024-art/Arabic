<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e4945">
  <meta name="description" content="عَرَبِيَّةُ الْقُرْآنِ من Arabic Light Academy: تعلّم المفردات والنحو والإعراب والتدريبات من سور القرآن الكريم.">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <title>عَرَبِيَّةُ الْقُرْآنِ — Arabic Light Academy</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="التنقل الرئيسي">
      <a class="brand" href="#/" data-route="home" aria-label="العودة للرئيسية">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 60 60" fill="none"><path d="M30 3 37 21 56 16 43 30 56 44 37 39 30 57 23 39 4 44 17 30 4 16 23 21Z" stroke="currentColor" stroke-width="1.5"/><circle cx="30" cy="30" r="11" stroke="currentColor" stroke-width="1.5"/><path d="M30 21v18M21 30h18" stroke="currentColor" opacity=".5"/></svg></span>
        <span><strong>ARABIC LIGHT</strong><small>ACADEMY</small></span>
      </a>
      <div class="sidebar-label">منصة التعلّم</div>
      <nav id="side-nav" class="side-nav"></nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-note">
        <span class="sidebar-note-icon">✦</span>
        <strong>رحلة من الناس إلى الأحقاف</strong>
        <p>خطوة صغيرة كل يوم لفهم لغة كتاب الله.</p>
      </div>
      <div class="sidebar-footer">© Arabic Light Academy</div>
    </aside>
    <div class="mobile-overlay" id="mobile-overlay" data-action="close-menu"></div>
    <div class="app-body">
      <header class="topbar">
        <div class="topbar-start">
          <button class="icon-button menu-button" id="menu-button" data-action="toggle-menu" aria-label="فتح القائمة"><span class="hamburger">☰</span></button>
          <div class="breadcrumbs" id="breadcrumbs"></div>
        </div>
        <div class="topbar-end">
          <span class="topbar-date">بِسْمِ اللَّهِ نَبْدَأُ</span>
          <button class="top-action search-shortcut" data-action="open-library" aria-label="بحث عن سورة"><span class="search-glyph">⌕</span><span>ابحث عن سورة</span></button>
          <button class="profile-pill" data-route="progress" aria-label="عرض تقدمك"><span class="profile-avatar">م</span><span>رحلتي</span></button>
        </div>
      </header>
      <main id="app" tabindex="-1"></main>
      <footer class="page-footer"><span>عَرَبِيَّةُ الْقُرْآنِ · Arabic Light Academy</span><span>تعلّم بتدبّر، وتقدّم بثبات</span></footer>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <audio id="quran-audio" preload="none"></audio>
  <script src="/app.js" defer></script>
</body>
</html>
